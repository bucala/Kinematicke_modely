plugins { id 'com.android.application' }
android {
    namespace 'sk.kinematika.studio'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'sk.kinematika.studio'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('KINMO_VERSION_CODE') ?: '1')
        versionName System.getenv('KINMO_VERSION') ?: '2.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('KINMO_KEYSTORE')) {
                storeFile file(System.getenv('KINMO_KEYSTORE'))
                storePassword System.getenv('KINMO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KINMO_KEY_ALIAS') ?: 'kinematika'
                keyPassword System.getenv('KINMO_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
