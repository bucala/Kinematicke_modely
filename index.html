    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <body>
    <a class="skip-link" href="#workspace">Preskočiť na pracovnú plochu</a>
    <div id="app">
      <div class="boot-screen"><span class="boot-mark">k.</span><p>Pripravujeme pracovnú plochu…</p></div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title" closedby="closerequest"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept=".kinmo,.json,application/json" hidden />
    <input id="workbench-import-file" type="file" accept=".kinmolib,.kinmoversions,.json,application/json" hidden />
    <input id="magic-image-file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden />
    <input id="reference-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <input id="magic-pose-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <noscript><div class="noscript">Na spustenie simulátora povoľte JavaScript v prehliadači.</div></noscript>
