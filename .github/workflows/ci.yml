name: Kinematika web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, mechanism and CAD tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up Python for isolated CAD tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test solver, editor, physics and exports
        run: npm test

      - name: Test loopback bridge and mock Fusion import
        run: python -B tests/test_fusion.py

      - name: Build static application
        run: npm run build

  browser:
    name: Browser suite and application boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Playwright stays out of package.json; the application itself needs no packages.
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Run browser suite, HTTP and file:// boot, mobile layout
        run: npm run test:browser
