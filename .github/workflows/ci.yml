name: Validate Kinematika

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, mechanism and CAD tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up Python for isolated CAD tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test solver, editor, physics and exports
        run: npm test

      - name: Test loopback bridge and mock Fusion import
        run: python -B tests/test_fusion.py

      - name: Build static application
        run: npm run build
