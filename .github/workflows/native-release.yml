name: Native Windows and Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: native-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          node -e "const fs=require('fs');const v=require('./package.json').version.split('.');const n=1000+Number(process.env.GITHUB_RUN_NUMBER);if(n>65535)throw Error('Version sequence exhausted');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+v[0]+'.'+v[1]+'.'+n+'\\ncode='+n+'\\n')"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm run check && npm test && python3 -m unittest discover -s tests -p '*fusion*.py'
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KINMO_VERSION: ${{ needs.version.outputs.version }}
      KINMO_REVISION: ${{ github.sha }}
      KINMO_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: npm run build
      - run: node scripts/native-assets.mjs windows
        env: {PYTHON: python}
      - run: dotnet publish native/windows/Kinematika.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:KinmoVersion=$env:KINMO_VERSION -o artifacts/windows
      - name: Verify Windows application and prepare download
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/windows/KinematikaStudio.exe').Path
          # A WinExe launched with & can return before its process exits.
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
            throw "Windows self-test failed (exit code: $($process.ExitCode))."
          }
          $package = "artifacts/KinematikaStudio-$env:KINMO_VERSION.exe"
          Copy-Item -LiteralPath $exe -Destination $package -ErrorAction Stop
          if ((Get-Item -LiteralPath $package).Length -lt 1000) {
            throw 'Windows download is missing or invalid.'
          }
          Get-FileHash -LiteralPath $package -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*.exe
          if-no-files-found: error
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KINMO_VERSION: ${{ needs.version.outputs.version }}
      KINMO_VERSION_CODE: ${{ needs.version.outputs.code }}
      KINMO_REVISION: ${{ github.sha }}
      KINMO_PLATFORM: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Configure permanent release signing key
        env:
          ANDROID_SECRETS: ${{ secrets.ANDROID_SECRETS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/prepare-android-signing.mjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes the retired SDK package "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: npm run build && node scripts/native-assets.mjs android
      - run: gradle -p native/android assembleRelease
      - run: |
          mkdir -p artifacts
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify native/android/app/build/outputs/apk/release/app-release.apk
          cp native/android/app/build/outputs/apk/release/app-release.apk "artifacts/KinematikaStudio-$KINMO_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error
  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    env:
      KINMO_VERSION: ${{ needs.version.outputs.version }}
      KINMO_REVISION: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - run: node scripts/publish-release.mjs artifacts --manifest-only
      - uses: actions/upload-artifact@v4
        with: {name: release-manifest, path: artifacts/latest.json, if-no-files-found: error}
      - name: Publish to Cloudflare R2 and deploy application
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure Cloudflare secrets to publish. Build artifacts remain downloadable in Actions.'; exit 1; }
          node scripts/publish-release.mjs artifacts
          npm run build
          npx --yes wrangler@4 deploy --config wrangler.toml
