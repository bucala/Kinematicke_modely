name: Diagnose Cloudflare access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-check.yml'
      - 'scripts/check-cloudflare.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Read-only Cloudflare diagnostics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --use-env-proxy scripts/check-cloudflare.mjs
